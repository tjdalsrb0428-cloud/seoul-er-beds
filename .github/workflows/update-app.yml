name: update-app-data

on:
  schedule:
    - cron: "17 */6 * * *"   # 6시간마다 앱용 확률 추정치 다시 계산
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect            # 수집 커밋과 겹치지 않게 같은 그룹 사용
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r analysis/requirements.txt

      - name: Export app data
        run: python analysis/export_app.py

      - name: Commit
        run: |
          git config user.name "er-collector-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/app_data.json docs/app_data.js
          git diff --cached --quiet && exit 0
          git commit -m "app: 확률 추정치 갱신 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M')"
          for i in 1 2 3; do
            git pull --rebase && git push && exit 0
            sleep 5
          done
          exit 1
